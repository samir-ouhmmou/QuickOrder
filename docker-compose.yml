services:
  postgres:
    image: postgres:16
    container_name: quikorder-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: quikorder
      POSTGRES_USER: quikorder
      POSTGRES_PASSWORD: quikorder
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
