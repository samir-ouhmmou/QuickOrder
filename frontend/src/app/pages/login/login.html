<main class="login zellige">
  <section class="login__card arch">
    <span class="login__star star-spin" aria-hidden="true"></span>

    <header class="login__header">
      <p class="eyebrow">QuickOrder</p>
      <p class="login__welcome" lang="ar" dir="rtl">مرحباً بك</p>
      <h1 class="login__title">Connectez-vous pour commander</h1>
    </header>

    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()">
      <fieldset class="role">
        <legend class="role__legend">Type de compte</legend>
        <div class="role__options">
          <label class="role__option">
            <input type="radio" formControlName="role" value="client" />
            <span>Client</span>
          </label>
          <label class="role__option">
            <input type="radio" formControlName="role" value="serveur" />
            <span>Serveur</span>
          </label>
          <label class="role__option">
            <input type="radio" formControlName="role" value="admin" />
            <span>Admin</span>
          </label>
        </div>
      </fieldset>

      <div class="field">
        <label class="field__label" for="email">Adresse email</label>
        <input class="field__input" id="email" type="email" formControlName="email" autocomplete="email" />
      </div>

      <div class="field">
        <label class="field__label" for="password">Mot de passe</label>
        <div class="field__group">
          <input class="field__input" id="password" formControlName="password"
                 [type]="showPassword ? 'text' : 'password'" autocomplete="current-password" />
          <button class="field__toggle" type="button" (click)="showPassword = !showPassword">
            {{ showPassword ? 'Masquer' : 'Afficher' }}
          </button>
        </div>
      </div>

      <div class="login__options">
        <label class="check">
          <input type="checkbox" formControlName="remember" />
          <span>Rester connecté</span>
        </label>
        <a class="text-link" routerLink="/mot-de-passe-oublie">Mot de passe oublié ?</a>
      </div>

      <button class="btn btn--primary btn-3d" type="submit" [disabled]="form.invalid">
        Se connecter
      </button>
    </form>

    <p class="login__switch">
      Pas encore de compte ? <a class="text-link" routerLink="/inscription">Créer un compte</a>
    </p>

    <footer class="login__footer">
      <p>Commandez vite, soyez livré facilement</p>
      <p lang="ar" dir="rtl">اطلب بسرعة، توصل بسهولة</p>
    </footer>
  </section>
</main>
