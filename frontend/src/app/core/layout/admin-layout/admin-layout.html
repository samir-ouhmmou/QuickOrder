<div class="admin">
  <button class="admin__burger" type="button" (click)="toggleMenu()" aria-label="Menu">
    ☰
  </button>

  <aside class="sidebar" [class.sidebar--open]="menuOpen()">
    <a class="sidebar__brand" routerLink="/">
      <span class="sidebar__mark">Q</span>
      <span>Dar Dmana</span>
    </a>

    <nav class="sidebar__nav" aria-label="Navigation admin">
      @for (item of visibleItems; track item.path) {
      <a
        class="sidebar__link"
        [routerLink]="item.path"
        routerLinkActive="sidebar__link--active"
        (click)="menuOpen.set(false)"
      >
        {{ item.label }}
      </a>
      }
    </nav>

    <div class="sidebar__footer">
      <p class="sidebar__user">{{ name }}</p>
      <button class="sidebar__logout" type="button" (click)="logout()">Déconnexion</button>
    </div>
  </aside>

  <main class="admin__content">
    <router-outlet />
  </main>
</div>
