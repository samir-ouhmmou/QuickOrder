<header class="navbar" [class.scrolled]="scrolled()">
  <div class="container navbar__inner">
    <a routerLink="/" class="navbar__logo" (click)="closeMenu()">Dar Dmana</a>

    <button
      class="navbar__burger"
      type="button"
      aria-label="Ouvrir le menu"
      [attr.aria-expanded]="menuOpen()"
      (click)="toggleMenu()"
    >
      <span></span><span></span><span></span>
    </button>

    <nav class="navbar__nav" [class.open]="menuOpen()">
      <a
        class="navbar__insta"
        href="https://www.instagram.com/"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="18" height="18" rx="5"></rect>
          <circle cx="12" cy="12" r="4"></circle>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle>
        </svg>
      </a>

      @for (link of links; track link.label) {
        <a class="navbar__link" [routerLink]="link.path" [fragment]="link.fragment" (click)="closeMenu()">
          {{ link.label }}
        </a>
      }

      <a class="btn btn-accent" routerLink="/" fragment="contact" (click)="closeMenu()">Contact Us</a>
    </nav>
  </div>
</header>
