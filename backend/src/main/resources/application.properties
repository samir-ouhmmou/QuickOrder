spring.application.name=Restauration

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5434/quikorder}
spring.datasource.username=${DB_USERNAME:quikorder}
spring.datasource.password=${DB_PASSWORD:quikorder}
server.port=8081
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Local development key only; set JWT_SECRET to a secure Base64 key outside development.
jwt.secret=${JWT_SECRET:cXVpY2tvcmRlci1sb2NhbC1kZXZlbG9wbWVudC1zZWNyZXQta2V5LTIwMjY=}
jwt.expiration=86400000

# Optional local configuration file (ignored by git)
spring.config.import=optional:application-local.properties

google.oauth.enabled=${GOOGLE_OAUTH_ENABLED:false}
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
frontend.base-url=${FRONTEND_BASE_URL:http://localhost:4200}
